<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Draven | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!--external css-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <a class="logo" href="index.html">DRAVEN</a>
        <div class="header-right">
            <button class="icon-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            </button>
            <a class="icon-btn" href="checkout.html" aria-label="Cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h3l2.5 12h11L21 6H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
            </a>
        </div>
    </header>
    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="product.html">Shop</a>
        <a href="checkout.html">Cart</a>
    </nav>

    <main class="page">
        <form class="card checkout" id="checkout-form">
            <div class="summary"><span>Order summary</span><span>$100.00</span></div>

            <h2>Contact</h2>
            <label for="email">EMAIL</label>
            <input type="email" id="email" required>

            <h2>Shipping address</h2>
            <div class="fields">
                <div class="wide"><label for="country">COUNTRY</label><input type="text" id="country" required></div>
                <div><label for="first">FIRST NAME</label><input type="text" id="first" required></div>
                <div><label for="last">LAST NAME</label><input type="text" id="last" required></div>
                <div><label for="city">CITY</label><input type="text" id="city" required></div>
                <div><label for="state">STATE</label><input type="text" id="state" required></div>
                <div><label for="zip">ZIP CODE</label><input type="text" id="zip" required></div>
                <div><label for="phone">PHONE</label><input type="tel" id="phone" required></div>
            </div>

            <h2>Mode of payment</h2>
            <div class="pay" data-group>
                <button type="button">[1]</button>
                <button type="button">[2]</button>
                <button type="button">[3]</button>
            </div>

            <button class="btn full" type="submit">CONTINUE TO SHIPPING</button>
            <a class="back" href="product.html">‹ Return to cart</a>
        </form>
    </main>

    <footer class="footer">
        <a class="logo" href="index.html">DRAVEN</a>
        <div>
            <h3>About us</h3>
            <a href="#">Our story</a>
            <a href="#">Contact</a>
        </div>
        <div>
            <h3>Socials</h3>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
        <div>
            <h3>Privacy</h3>
            <a href="#">Privacy policy</a>
            <a href="#">Terms of service</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
